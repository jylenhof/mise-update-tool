#:schema https://mise.jdx.dev/schema/mise.json

[tools]  # tombi: format.rules.table-keys-order = "ascending"
# tools to use on all my projects
action-validator = "0.9.0"
actionlint = "1.7.12"
editorconfig-checker = "3.11.1"
ghalint = "1.5.6"
pinact = "4.1.1"
"pipx:gh-action-pulse" = { version = "1.4.0", uvx = "true" }
prek = "0.4.14"
rumdl = "0.2.60"
shellcheck = "0.11.0"
shfmt = "3.13.1"
tombi = "1.4.1"
uv = "0.12.5"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
zizmor = "1.29.0"

aube = "latest"
# Pin the Node.js version for the project
node = "24"

[env]
# Optional: if your action needs environment variables for local tests
# (for example a test GitHub token or an API URL)
GITHUB_OUTPUT = "./.github_output_test"

[tasks.build]
description = "Build the GitHub Action into a single executable file"
# mise can run aube and vite because they are in the context
run = "aube exec vite build"

[tasks.test]
description = "Run the unit test suite with Vitest"
run = "aube exec vitest run --coverage"

[tasks.test-watch]
description = "Run tests in watch mode for active development"
run = "aube exec vitest"

[tasks.lint]
description = "Lint and format-check TypeScript sources with Biome"
run = "aube exec biome check ."

[tasks.format]
description = "Format TypeScript sources with Biome"
run = "aube exec biome format --write ."

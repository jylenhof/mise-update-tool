---
name: mise tool updates

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
    inputs:
      tools:
        description: Comma separated tools to upgrade. Leave empty to upgrade all local tools.
        required: false
        default: ''
      keep:
        description: Comma separated tools to exclude from the upgrade.
        required: false
        default: node
      pull-request-strategy:
        description: Use single for one PR with all tools, or per-tool for one PR per tool.
        required: false
        default: single
      mise_cache:
        description: Override mise-action cache option.
        required: false
        type: boolean
        default: true
      mise_version:
        description: Override mise-action version option.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Cleaning up"
        uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e # v1.4.5
        with:
          run: |
            echo "Pre-Check Cleanup"
            echo "~/.local" | xargs rm -rf
          post: |
            echo "Post-Check Cleanup"
            echo "~/.local" | xargs rm -rf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.mise_cache) || vars.MISE_CACHE || 'true' }}
          cache_key_prefix: mise-v1-mise-update.yaml
          version: ${{ inputs.mise_version || vars.MISE_VERSION }}

      - name: Upgrade local mise tools
        uses: $/
        with:
          token: ${{ steps.generate-token.outputs.token }}
          tools: ${{ inputs.tools || '' }}
          keep: ${{ inputs.keep || 'node' }}
          pull-request-strategy: ${{ inputs.pull-request-strategy || 'single' }}

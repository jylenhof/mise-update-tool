---
name: Code Checks
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_release:
        description: Force release
        required: false
        type: boolean
        default: false
      mise_version:
        description: Override mise-action version option.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek-checks:
    name: Prek Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "Cleaning up"
        uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e # v1.4.5
        with:
          run: |
            echo "Pre-Check Cleanup"
            echo "~/.local" | xargs rm -rf
          post: |
            echo "Post-Check Cleanup"
            echo "~/.local" | xargs rm -rf

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_INSTALL_FROM_GITHUB: 1
        with:
          # Disable cache on tag publishes so a poisoned mise cache cannot
          # be restored into the uploaded distribution (zizmor
          # cache-poisoning). PRs and branch pushes may still cache.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key_prefix: mise-v1-code-checks.yml
          version: ${{ inputs.mise_version || vars.MISE_VERSION }}

      - name: Run prek checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: prek run --all-files --show-diff-on-failure

  build:
    name: Build TypeScript distribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - prek-checks
    steps:
      - name: "Cleaning up"
        uses: gacts/run-and-post-run@fc6503862aba998e2f2123225ad63c09a92ed46e # v1.4.5
        with:
          run: |
            echo "Pre-Check Cleanup"
            echo "~/.local" | xargs rm -rf
          post: |
            echo "Post-Check Cleanup"
            echo "~/.local" | xargs rm -rf

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_INSTALL_FROM_GITHUB: 1
        with:
          # Disable cache on tag publishes so a poisoned mise cache cannot
          # be restored into the uploaded distribution (zizmor
          # cache-poisoning). PRs and branch pushes may still cache.
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache_key_prefix: mise-v1-code-checks.yml
          version: ${{ inputs.mise_version || vars.MISE_VERSION }}

      - name: Build action bundle
        run: aube exec vite build

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 # gh-action-pulse: ignore[max-age]
        if: startsWith(github.ref, 'refs/tags') || inputs.force_release == true
        with:
          name: action-distribution
          path: dist/
